name: Check uploaded assets

on:
  push:
    paths: ['public/assets/**', 'scripts/check-assets.mjs']
  pull_request:
    paths: ['public/assets/**', 'scripts/check-assets.mjs']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-assets.mjs
